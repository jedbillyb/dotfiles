# Hyprland config for void-btw.
#
# This is the macOS-looking session. The sway session next door is deliberately
# the plain rectangular one and must stay that way; nothing here should be
# copied back into sway/config.
#
# Picked at the emptty login screen. See emptty/emptty for how the picker and
# the login shell fit together.
#
# Every option name in this file was checked against `hyprctl getoption` on the
# 0.56.2 build actually installed here, not against the wiki. Several names
# that every config on the internet still uses were renamed or removed in 0.56:
# misc:vfr is gone (VFR is unconditional now), dwindle:pseudotile is gone
# (pseudotiling is the `pseudo` dispatcher and a window rule), and the layer
# rules are no_anim / ignore_alpha / blur_popups, not noanim / ignorezero.

# ── Variables ─────────────────────────────────────────────────────────────────

$mod = SUPER
$term = footclient
$menu = $HOME/.local/bin/spotlight

# ── Monitor ───────────────────────────────────────────────────────────────────

monitor = , preferred, auto, 1

# ── Environment ───────────────────────────────────────────────────────────────

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1

# ── Autostart ─────────────────────────────────────────────────────────────────

# Hand the session environment to D-Bus first, before anything can trigger
# portal activation. Same reasoning as the sway session: without it the
# activated services come up with no WAYLAND_DISPLAY and the portal frontend
# silently drops interfaces rather than reporting a dead backend.
exec-once = dbus-update-activation-environment --all

# Wallpaper. swaybg rather than hyprpaper: hyprpaper is another source build
# and this needs nothing hyprpaper has.
exec-once = swaybg -m fill -i /mnt/shared/wallpapers/landscape-mountains-black-white.jpg

# The terminal server. exec-once is enough here because Hyprland has no
# config-reload re-exec the way sway's exec_always does.
exec-once = foot --server

exec-once = pipewire
exec-once = pipewire-pulse
exec-once = wireplumber
exec-once = dunst

# The menu bar. `exec` rather than `exec-once` because it is Hyprland's
# equivalent of sway's `exec_always`: it fires again on `hyprctl reload`, which
# is what waybar-run.sh's reload handover was written for, so Mod+Shift+r picks
# up an edited bar config instead of leaving the old bar up. Running it twice
# is safe -- the second copy loses the flock and just restarts the live bar.
# It picks the macOS-styled waybar/macos bar off HYPRLAND_INSTANCE_SIGNATURE
# (sway deliberately keeps the plain rectangular one), so the choice of bar
# needs nothing said here.
exec = $HOME/.local/bin/waybar-run.sh

# ── Input ─────────────────────────────────────────────────────────────────────

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ── Look ──────────────────────────────────────────────────────────────────────
#
# The point of this session. Sway stays rectangular; this one is the macOS one.

general {
    # macOS is not a tiler, so there is no authentic gap value. These are
    # picked so the shadow has somewhere to land: with gaps_out below the
    # shadow range the shadows of neighbouring windows overlap into mud.
    gaps_in = 6
    gaps_out = 12
    border_size = 1

    # A hairline, the way macOS outlines a window, rather than a tiling WM's
    # thick focus ring. Focus is carried mostly by the shadow and the opacity
    # difference below, not by the border.
    col.active_border = rgba(ffffff40) rgba(ffffff18) 45deg
    col.inactive_border = rgba(ffffff0f)

    layout = dwindle
    resize_on_border = true
}

decoration {
    # 12px at power 2.4 is close to Apple's squircle. rounding_power is the
    # superellipse exponent: 2.0 is a plain circular arc, higher values hold
    # the straight edge for longer before turning the corner, which is what
    # makes a macOS corner look "continuous" rather than stuck-on.
    rounding = 12
    rounding_power = 2.4

    active_opacity = 1.0
    inactive_opacity = 0.96

    # Large, soft, offset downward. macOS shadows are much wider and fainter
    # than the default 4px/near-black, and the active/inactive difference is
    # doing most of the work of showing focus given the 1px border.
    shadow {
        enabled = true
        range = 40
        render_power = 3
        offset = 0 8
        color = rgba(0000006e)
        color_inactive = rgba(00000030)
    }

    # Apple calls this vibrancy, and so does Hyprland. Only translucent
    # surfaces blur, which is why the terminal gets an opacity rule below.
    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.015
        contrast = 1.05
        brightness = 1.0
        vibrancy = 0.28
        vibrancy_darkness = 0.1
        popups = true
        popups_ignorealpha = 0.4
    }
}

# ── Animation ─────────────────────────────────────────────────────────────────
#
# macOS motion is fast out of the gate and settles slowly, with a touch of
# overshoot on things that appear. Durations are in deciseconds.

animations {
    enabled = true

    bezier = macEase,   0.32, 0.72, 0.00, 1.00
    bezier = macSpring, 0.20, 1.25, 0.35, 1.00
    bezier = macLinear, 0.00, 0.00, 1.00, 1.00

    animation = windowsIn,        1, 4.0, macSpring, popin 92%
    animation = windowsOut,       1, 3.0, macEase,   popin 94%
    animation = windowsMove,      1, 4.0, macEase,   slide

    animation = layersIn,         1, 3.0, macSpring, popin 90%
    animation = layersOut,        1, 2.5, macEase,   popin 92%

    animation = fadeIn,           1, 3.5, macEase
    animation = fadeOut,          1, 2.5, macEase
    animation = fadeLayersIn,     1, 3.0, macEase
    animation = fadeLayersOut,    1, 2.5, macEase

    animation = border,           1, 6.0, macLinear
    animation = workspaces,       1, 5.0, macEase, slidefade 18%
    animation = specialWorkspace, 1, 4.5, macEase, slidefadevert 15%
}

# ── Misc ──────────────────────────────────────────────────────────────────────

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0

    # Matches the GTK dark Adwaita ground, so the flash before swaybg comes up
    # is not white.
    background_color = rgb(1c1c1e)
    font_family = Inter

    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    focus_on_activate = true
}

dwindle {
    preserve_split = true
    smart_resizing = true
}

# ── Layer rules ───────────────────────────────────────────────────────────────
#
# above_lock answers the open question from the prompt: Hyprland can do the
# waybar-above-the-lock-screen trick natively, so this session needs no
# equivalent of the lock_visible_namespace patch carried by /usr/bin/sway.
#   above_lock = 1  drawn above the lock screen, not clickable
#   above_lock = 2  drawn above it and still takes input
# 1 is the match for what the patched sway does. 2 would let anyone click bar
# modules on a locked machine, so it stays off deliberately.
layerrule = above_lock 1, match:namespace waybar

layerrule = blur 1, match:namespace waybar
layerrule = ignore_alpha 0.3, match:namespace waybar
layerrule = blur 1, match:namespace notifications
layerrule = ignore_alpha 0.3, match:namespace notifications
layerrule = blur 1, match:namespace launcher

# ── Window rules ──────────────────────────────────────────────────────────────

# Blur only touches translucent surfaces, so the terminal has to be translucent
# for the frosted look to appear at all.
windowrule = opacity 0.92 0.88, match:class ^(foot|footclient)$

windowrule = float 1, match:class ^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = float 1, match:title ^(Open File|Save File|Open Folder)$

# ── Keybinds ──────────────────────────────────────────────────────────────────
#
# The sway set is ported as-is so muscle memory carries over, with macOS-style
# chords added on top. The four sway bindings that have no dwindle equivalent
# are called out where they appear.

# Launchers
bind = $mod, Return, exec, $term
bind = $mod, R, exec, $menu
bind = $mod, SPACE, exec, $menu
bind = $mod, P, exec, Thunar
bind = $mod, F, exec, firefox
bind = $mod, C, exec, google-chrome-stable
bind = $mod, N, exec, /mnt/shared/projects/noted/local/noted-quickadd.sh
bind = $mod, D, exec, $HOME/.local/bin/show-desktop.sh

# Session
bind = $mod, Q, killactive
bind = $mod SHIFT, O, exit
bind = $mod SHIFT, P, exec, loginctl poweroff
bind = $mod SHIFT, I, exec, $HOME/.local/bin/sway-lock.sh
bind = $mod SHIFT, V, exec, $HOME/.local/bin/vpn-toggle.sh
bind = $mod SHIFT, C, exec, $HOME/.local/bin/caffeine-toggle.sh
bind = $mod SHIFT, M, exec, gnome-network-displays
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, R, exec, sudo /usr/libexec/elogind/system-sleep/touchpad-resume-fix.sh
bind = $mod SHIFT, R, exec, $HOME/.local/bin/wifi-recover.sh

# Window state
bind = $mod SHIFT, SPACE, togglefloating
bind = $mod SHIFT, F, fullscreen
bind = $mod, B, exec, $HOME/.local/bin/waybar-toggle.sh

# sway's `$mod+w layout tabbed` becomes a Hyprland group, which is the same
# idea: several windows stacked in one tile with a header. Kept on w rather
# than freed up for a macOS Cmd+W close, because the sway muscle memory for
# closing is already $mod+q.
bind = $mod, W, togglegroup
bind = $mod, S, changegroupactive

# sway's `$mod+e layout toggle split` and `$mod+h split h`. dwindle splits on
# the long edge automatically, so togglesplit flips the current one and
# preselect forces where the next window lands.
bind = $mod, E, layoutmsg, togglesplit
bind = $mod, H, layoutmsg, preselect r

# sway's `$mod+grave focus mode_toggle` swapped focus between the floating and
# tiling layers. dwindle has no such split, so this is the nearest thing in
# spirit and the nearest thing to Cmd+Tab: bounce to the last window.
bind = $mod, grave, focuscurrentorlast

# sway's `$mod+a focus parent` has no dwindle equivalent at all. There is no
# container tree to walk up, so it is deliberately left unbound.

# Focus: j/k/l/semicolon as on sway, arrows alongside.
bind = $mod, J, movefocus, l
bind = $mod, K, movefocus, d
bind = $mod, L, movefocus, u
bind = $mod, semicolon, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

# Move
bind = $mod SHIFT, J, movewindow, l
bind = $mod SHIFT, K, movewindow, d
bind = $mod SHIFT, L, movewindow, u
bind = $mod SHIFT, semicolon, movewindow, r
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# macOS switches desktops with Ctrl and an arrow. $mod is added so this does
# not eat the terminal's own Ctrl+arrow word navigation.
bind = $mod CTRL, right, workspace, r+1
bind = $mod CTRL, left, workspace, r-1

# Media and brightness, straight from sway.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioStop, exec, playerctl stop
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshots, straight from sway.
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = , grave, exec, mkdir -p /mnt/shared/pictures/Screenshots && f="/mnt/shared/pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png" && grim "$f" && notify-send -t 1200 "Screenshot saved" "$f"
bind = SHIFT, grave, exec, mkdir -p /mnt/shared/pictures/Screenshots && f="/mnt/shared/pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png" && grim -c "$f" && notify-send -t 1200 "Screenshot saved (cursor)" "$f"

# Mouse drag to move and resize, as sway's floating_modifier does.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Resize submap ─────────────────────────────────────────────────────────────
#
# sway's `mode "resize"`, entered with $mod+Shift+d exactly as there.

bind = $mod SHIFT, D, submap, resize
submap = resize

binde = , J, resizeactive, -10 0
binde = , K, resizeactive, 0 10
binde = , L, resizeactive, 0 -10
binde = , semicolon, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , down, resizeactive, 0 10
binde = , up, resizeactive, 0 -10
binde = , right, resizeactive, 10 0

bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $mod, R, submap, reset

submap = reset

# ── Debug ─────────────────────────────────────────────────────────────────────
#
# On by default in Hyprland, which means the session log stops after startup
# and a transient error banner leaves no trace. Kept off so the log is complete.
debug {
    disable_logs = false
}
