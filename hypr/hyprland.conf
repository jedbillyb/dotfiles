# Hyprland config for void-btw.
#
# This is the macOS-looking session. The sway session next door is deliberately
# the plain rectangular one and must stay that way; nothing here should be
# copied back into sway/config.
#
# Picked at the emptty login screen. See emptty/emptty for how the picker and
# the login shell fit together.

# ── Variables ─────────────────────────────────────────────────────────────────

$mod = SUPER
$term = footclient
$menu = $HOME/.local/bin/spotlight

# ── Monitor ───────────────────────────────────────────────────────────────────

# Preferred mode, auto position, no scaling. The panel is 1920x1080.
monitor = , preferred, auto, 1

# ── Environment ───────────────────────────────────────────────────────────────

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1

# ── Autostart ─────────────────────────────────────────────────────────────────

# Hand the session environment to D-Bus first, before anything can trigger
# portal activation. Same reasoning as the sway session: without it the
# activated services come up with no WAYLAND_DISPLAY and the portal frontend
# silently drops interfaces rather than reporting a dead backend.
exec-once = dbus-update-activation-environment --all

# Wallpaper. swaybg rather than hyprpaper for now: hyprpaper is another source
# build and this needs nothing hyprpaper has.
exec-once = swaybg -m fill -i /mnt/shared/wallpapers/landscape-mountains-black-white.jpg

# The terminal server. exec-once is enough here because Hyprland has no
# config-reload re-exec the way sway's exec_always does.
exec-once = foot --server

exec-once = pipewire
exec-once = pipewire-pulse
exec-once = wireplumber
exec-once = dunst

# ── Input ─────────────────────────────────────────────────────────────────────

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ── Look ──────────────────────────────────────────────────────────────────────
#
# Deliberately plain for the first launch. The macOS look (rounding, blur,
# shadows, animations) lands once the session is confirmed to start.

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 0
}

animations {
    enabled = false
}

# ── Keybinds ──────────────────────────────────────────────────────────────────
#
# Minimal set for the first launch, matching the sway bindings they mirror.
# The full port comes later.

bind = $mod, Return, exec, $term
bind = $mod, R, exec, $menu
bind = $mod, Q, killactive
bind = $mod SHIFT, O, exit
bind = $mod, F, exec, firefox
bind = $mod SHIFT, SPACE, togglefloating
bind = $mod SHIFT, F, fullscreen

# Focus: j/k/l/semicolon as on sway, arrows alongside.
bind = $mod, J, movefocus, l
bind = $mod, K, movefocus, d
bind = $mod, L, movefocus, u
bind = $mod, semicolon, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Mouse drag to move and resize, as sway's floating_modifier does.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
