[Settings]
# WhiteSur is the macOS-alike icon set, installed to ~/.local/share/icons by
# vinceliuice's install.sh (not packaged, so not tracked here). Waybar's dock
# names it explicitly as well, so the dock keeps its icons even if a GTK app
# overrides this.
gtk-icon-theme-name=WhiteSur-dark
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
# Inter is the closest freely redistributable face to SF Pro Text; sizes and
# metrics are near enough that UI laid out for one does not reflow badly.
gtk-font-name=Inter 11
gtk-cursor-theme-name=WhiteSur-cursors
gtk-cursor-theme-size=24
