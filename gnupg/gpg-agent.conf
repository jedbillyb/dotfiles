# The passphrase prompt is scripts/pinentry-wayland.py: a real dialog drawn as
# a Wayland layer surface in the desktop's own colours.
#
# Not pinentry-gtk-2: GTK 2 is X11-only, sway pre-creates /tmp/.X11-unix/X0
# without Xwayland behind it, and every signed commit then waited out 30s and
# failed with "signing failed: Timeout" and nothing on screen.
# Not pinentry-bemenu either: reliable, but it is a strip across the top of the
# screen that reads as part of the bar.
#
# gpg-agent expands the leading ~ itself.
pinentry-program ~/.local/bin/pinentry-wayland.py
allow-loopback-pinentry
# 8h / 12h: typing the passphrase once a working day, rather than keeping it
# anywhere on disk behind a fingerprint.
default-cache-ttl 28800
max-cache-ttl 43200
