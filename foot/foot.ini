# foot terminal config. Foot uses built-in defaults for anything not set
# here, so this only carries overrides.
#
# foot follows the system light/dark preference, so alpha must be set in
# both sections to stay transparent either way.
# Background transparency: 0.0 = fully transparent, 1.0 = opaque.

[colors-dark]
alpha=0.85

[colors-light]
alpha=0.85
