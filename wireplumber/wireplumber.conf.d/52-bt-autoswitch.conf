# 52-bt-autoswitch.conf - switch the default output to Bluetooth headphones
# when they connect. Script: wireplumber/scripts/bt-autoswitch.lua (linked to
# ~/.local/share/wireplumber/scripts by install.sh)
wireplumber.components = [
  {
    name = bt-autoswitch.lua, type = script/lua
    provides = custom.bt-autoswitch
  }
]

wireplumber.profiles = {
  main = {
    custom.bt-autoswitch = required
  }
}
