# 51-no-phone-audio-sink.conf - stop the iPhone routing its audio to the laptop.
#
# The phone is paired for ANCS notifications only (see ancs4linux), but iOS
# also sees the laptop's A2DP Sink / HFP Handsfree records and happily offers
# it as a speaker - so music and calls get grabbed by the laptop the moment the
# phone connects, and wireplumber lands the card on the "audio-gateway"
# (A2DP Source & HSP/HFP AG) profile.
#
# Two layers:
#   1. Drop the *sink-side* Bluetooth roles entirely, so the laptop no longer
#      publishes A2DP Sink / HSP HS / HFP HF and the phone stops listing it as
#      an audio output at all. The roles the laptop needs for its own
#      headphones (it is the source / audio gateway there: AirPods, WH-1000XM5,
#      LE-audio buds) are all kept.
#   2. Belt and braces: pin the phone's card to the "off" profile by name, in
#      case something re-adds the sink roles. device.profile takes absolute
#      priority in wireplumber's find-best-profile.lua.

monitor.bluez.properties = {
  # default is [ a2dp_sink a2dp_source bap_sink bap_source hsp_hs hsp_ag hfp_hf hfp_ag ]
  bluez5.roles = [ a2dp_source bap_source hsp_ag hfp_ag ]
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "bluez_card.B8_90_47_64_83_CB" }
    ]
    actions = {
      update-props = {
        device.profile = "off"
        bluez5.autoswitch-to-headset-profile = false
      }
    }
  }
]
